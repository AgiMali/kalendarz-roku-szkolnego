# Wyłączone: GitHub Pages ma brać pliki wprost z gałęzi main
# (Settings → Pages → Deploy from a branch → main / root).
# Stary deploy przez Actions zacinał się na „Queued / Ready to deploy”.

name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skip:
    runs-on: ubuntu-latest
    steps:
      - name: Pages są publikowane z gałęzi main
        run: echo "Ustaw Pages na Deploy from a branch → main → / (root)."
